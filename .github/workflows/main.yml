name: Compilar APK Nativo
on:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fuente
        uses: actions/checkout@v4

      - name: Instalar Node de Alta Potencia
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacion de dependencias
        run: |
          npm install --legacy-peer-deps
          npm run build || true

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar Cordova y compilar Android
        run: |
          npm install -g cordova
          cordova create native-app com.documentacionrrbb.asistentebienes "Asistente de Bienes"
          cd native-app
          cordova platform add android --no-telemetry
          rm -rf www/*
          if [ -d "../dist" ] && [ "$(ls -A ../dist 2>/dev/null)" ]; then
            cp -r ../dist/* www/
          else
            cp -r ../* www/ 2>/dev/null || true
            rm -rf www/native-app www/node_modules www/.github
          fi
          cordova build android --debug --device

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-instalable-apk
          path: native-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
