name: Compilar APK con Cordova
on:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar Node.js en el servidor
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Compilar la pagina web (Vite)
        run: npm run build

      - name: Configurar Java y Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Cordova de forma global
        run: npm install -g cordova

      - name: Crear proyecto Android desde cero
        run: |
          cordova create app-android com.documentacionrrbb.asistentebienes "Asistente de Bienes"
          cd app-android
          cordova platform add android
          rm -rf www/*
          cp -r ../dist/* www/
          cordova build android --debug

      - name: Guardar mi archivo APK listo
        uses: actions/upload-artifact@v4
        with:
          name: app-asistente-bienes-instalable
          path: app-android/platforms/android/app/build/outputs/apk/debug/app-debug.apk
